name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'
      release_notes:
        description: 'Release notes'
        required: false
        default: 'Bug fixes and performance improvements.'
      prerelease:
        description: 'Mark as pre-release (true/false)?'
        required: false
        default: 'false'

permissions:
  contents: write
  packages: write
  actions: read

env:
  FLUTTER_VERSION: '3.38.9'
  JAVA_VERSION: '17'
  WORKING_DIR: android

jobs:
  build-android:
    name: Build Signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${REQUESTED_VERSION:-${GITHUB_REF#refs/tags/}}"
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Flutter version info
        run: |
          flutter --version
          dart --version

      - uses: gradle/actions/wrapper-validation@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Analyze and test Android
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Build and verify signed APKs
        working-directory: ${{ env.WORKING_DIR }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SERVER_URL: ${{ vars.ANDROID_SERVER_URL }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing Android signing keystore}"
          : "${KEY_ALIAS:?Missing Android signing alias}"
          : "${KEY_PASSWORD:?Missing Android signing key password}"
          : "${STORE_PASSWORD:?Missing Android signing store password}"
          dart run scripts/validate_release_origin.dart "$SERVER_URL"
          export KEYSTORE_PATH="$RUNNER_TEMP/remoteshield-android.jks"
          trap 'rm -f -- "$KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          mkdir -p release-artifacts
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          flutter build apk --release --build-name "${VERSION#v}" --split-per-abi \
            --obfuscate --split-debug-info=build/debug-info \
            --dart-define="SERVER_URL=$SERVER_URL"
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$ABI-release.apk" \
              "release-artifacts/RemoteShieldX-$VERSION-$ABI.apk"
          done
          flutter build apk --release --build-name "${VERSION#v}" \
            --obfuscate --split-debug-info=build/debug-info-universal \
            --dart-define="SERVER_URL=$SERVER_URL"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "release-artifacts/RemoteShieldX-$VERSION-universal.apk"
          for APK in release-artifacts/*.apk; do
            "$TOOLS/apksigner" verify "$APK"
            "$TOOLS/zipalign" -c -P 16 -v 4 "$APK"
          done

      - name: Generate checksums
        working-directory: ${{ env.WORKING_DIR }}/release-artifacts
        run: |
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apks-${{ steps.version.outputs.version }}
          path: ${{ env.WORKING_DIR }}/release-artifacts/
          retention-days: 30
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-apks-${{ needs.build-android.outputs.version }}
          path: release-artifacts

      - name: List release artifacts
        run: ls -lah release-artifacts/

      - name: Set release metadata
        id: release_notes
        env:
          NOTES: ${{ inputs.release_notes }}
        run: |
          if [[ -n "$NOTES" ]]; then
            printf '%s\n' "$NOTES" > release-notes.md
          else
            printf '%s\n' 'RemoteShield X Android build. Minimum API 26, target API 36. See the Android operations guide for setup and verified runtime coverage.' > release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-android.outputs.version }}
          name: RemoteShieldX ${{ needs.build-android.outputs.version }} - Android
          body_path: release-notes.md
          prerelease: ${{ inputs.prerelease == 'true' }}
          draft: false
          make_latest: true
          files: |
            release-artifacts/RemoteShieldX-*.apk
            release-artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
