name: Pull request validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]
  workflow_call:

permissions:
  contents: read
defaults:
  run:
    shell: bash

jobs:
  workflow:
    name: Workflow and release tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Lint workflows and run release tests
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$archive"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
          shellcheck scripts/release/*.sh
          python3 -m unittest discover -s scripts/release -p 'test_*.py' -v
  backend:
    uses: ./.github/workflows/architecture.yml
  desktop:
    uses: ./.github/workflows/desktop-checks.yml
  network:
    uses: ./.github/workflows/network.yml
  containers:
    uses: ./.github/workflows/operations.yml
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-toolchain
      - name: Flutter analyze and test
        working-directory: android
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub --machine > flutter-tests.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: flutter-tests
          path: android/flutter-tests.jsonl
          retention-days: 14
          if-no-files-found: warn
  dependency-and-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: bash scripts/quality/install-scanners.sh "$RUNNER_TEMP/rsx-scanners"
      - name: Scan dependencies, tracked source and credentials
        run: |
          mkdir -p scan-results "$RUNNER_TEMP/rsx-source"
          git archive HEAD | tar -xf - -C "$RUNNER_TEMP/rsx-source"
          result=0
          for project in backend desktop admin-dashboard; do
            npm audit --prefix "$project" --audit-level=high --json > "scan-results/$project-audit.json" || result=1
          done
          "$RUNNER_TEMP/rsx-scanners/gitleaks" dir "$RUNNER_TEMP/rsx-source" --config .gitleaks.toml --redact=100 --report-format json --report-path scan-results/gitleaks.json || result=1
          "$RUNNER_TEMP/rsx-scanners/trivy" fs --scanners vuln,misconfig --severity HIGH,CRITICAL --exit-code 1 --format json --output scan-results/trivy.json "$RUNNER_TEMP/rsx-source" || result=1
          exit "$result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-and-secret-evidence
          path: scan-results/
          retention-days: 14
          if-no-files-found: warn
  acceptance:
    name: Required quality gate
    if: ${{ always() }}
    needs: [workflow, backend, desktop, network, containers, android, dependency-and-secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Require every prerequisite to pass
        env:
          JOBS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$JOBS"
          jq -e 'length == 7 and all(.[]; .result == "success")' <<< "$JOBS"
