name: Network packet checks
on:
  pull_request:
    branches: [main]
    paths: ['vpn-server/**', 'nginx/nginx.conf.template', '.github/workflows/network.yml']
  push:
    branches: [codex/remoteshield-enterprise-completion]
    paths: ['vpn-server/**', 'nginx/nginx.conf.template', '.github/workflows/network.yml']
permissions:
  contents: read
jobs:
  wireguard-namespaces:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y wireguard-tools nftables unbound dnsutils tcpdump nginx openssl
      - run: sudo bash vpn-server/tests/lab.sh
