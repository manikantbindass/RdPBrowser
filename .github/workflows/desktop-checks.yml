name: Desktop checks
on:
  pull_request:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop-checks.yml']
  push:
    branches: [codex/remoteshield-enterprise-completion]
    paths: ['desktop/**', '.github/workflows/desktop-checks.yml']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'desktop/src-tauri -> target'
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - run: npm ci --prefix desktop
      - run: npm test --prefix desktop
      - run: npm run build --prefix desktop
      - run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
