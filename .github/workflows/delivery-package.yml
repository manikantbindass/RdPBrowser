name: Package versioned artifacts
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      version:
        required: true
        type: string
      channel:
        required: true
        type: string
      androidCode:
        required: true
        type: string
      commit:
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  desktop:
    name: Bundle ${{ matrix.target }}
    environment: ${{ inputs.channel == 'preview' && 'release-verification' || 'release-signing' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: windows-x64, os: windows-2022}
          - {target: linux-x64, os: ubuntu-22.04}
          - {target: macos-universal, os: macos-15-intel}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      BUNDLE_TARGET: ${{ matrix.target }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_CHANNEL: ${{ inputs.channel }}
      REMOTESHIELD_SERVER: ${{ vars.REMOTESHIELD_SERVER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: stable
      - if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev patchelf
      - run: npm ci --prefix desktop
      - name: Import Windows code signing certificate
        if: runner.os == 'Windows' && env.RELEASE_CHANNEL != 'preview'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/release/windows-sign.ps1 import
      - name: Package desktop application
        if: runner.os != 'macOS' || env.RELEASE_CHANNEL == 'preview'
        run: |
          python=python3
          if [[ "$RUNNER_OS" == Windows ]]; then python=python; fi
          "$python" scripts/release/desktop.py "$BUNDLE_TARGET" "$RELEASE_TAG" "$RELEASE_VERSION" "$RELEASE_CHANNEL"
      - name: Sign and notarize macOS bundle
        if: runner.os == 'macOS' && env.RELEASE_CHANNEL != 'preview'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: python3 scripts/release/desktop.py "$BUNDLE_TARGET" "$RELEASE_TAG" "$RELEASE_VERSION" "$RELEASE_CHANNEL"
      - name: Sign Linux bundles
        if: runner.os == 'Linux' && env.RELEASE_CHANNEL != 'preview'
        env:
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
          LINUX_SIGNING_PASSPHRASE: ${{ secrets.LINUX_SIGNING_PASSPHRASE }}
          LINUX_SIGNING_FINGERPRINT: ${{ vars.LINUX_SIGNING_FINGERPRINT }}
        run: bash scripts/release/linux-sign.sh
      - name: Remove imported Windows certificate
        if: always() && runner.os == 'Windows' && env.RELEASE_CHANNEL != 'preview'
        shell: pwsh
        run: ./scripts/release/windows-sign.ps1 cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: payload-${{ matrix.target }}-${{ github.run_attempt }}
          path: release-payload/
          compression-level: 0
          retention-days: ${{ env.RELEASE_CHANNEL == 'preview' && 30 || 90 }}
          if-no-files-found: error
  android:
    name: Bundle Android APKs
    environment: ${{ inputs.channel == 'preview' && 'release-verification' || 'release-signing' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_CHANNEL: ${{ inputs.channel }}
      ANDROID_CODE: ${{ inputs.androidCode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-toolchain
      - working-directory: android
        run: flutter pub get --enforce-lockfile
      - name: Build disposable-key preview APKs
        if: env.RELEASE_CHANNEL == 'preview'
        run: bash scripts/release/android.sh
      - name: Build and verify distribution APKs
        if: env.RELEASE_CHANNEL != 'preview'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_SHA256: ${{ vars.ANDROID_SIGNING_SHA256 }}
          ANDROID_MIN_VERSION_CODE: ${{ vars.ANDROID_MIN_VERSION_CODE }}
          SERVER_URL: ${{ vars.ANDROID_SERVER_URL }}
        run: bash scripts/release/android.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: payload-android-${{ github.run_attempt }}
          path: release-payload/
          compression-level: 0
          retention-days: ${{ env.RELEASE_CHANNEL == 'preview' && 30 || 90 }}
          if-no-files-found: error
  containers:
    name: Package Docker images and SBOMs
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - env:
          SOURCE_COMMIT: ${{ inputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: bash scripts/release/containers.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: payload-containers-${{ github.run_attempt }}
          path: release-payload/
          compression-level: 0
          retention-days: ${{ inputs.channel == 'preview' && 30 || 90 }}
          if-no-files-found: error
