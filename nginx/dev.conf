# Local development control plane only. All published ports bind host loopback.
upstream control_api { server backend:3000; }
server {
    listen 80;
    server_tokens off;
    client_max_body_size 10k;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' ws:; img-src 'self' data:; frame-ancestors 'none'" always;
    location /api/ {
        proxy_pass http://control_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /socket.io/ {
        proxy_pass http://control_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /health { proxy_pass http://control_api; }
    location /ready { proxy_pass http://control_api; }
    location = /admin { return 301 /admin/; }
    location /admin/ { alias /var/www/remoteshield/admin-dashboard/; index index.html; }
    location / { return 404; }
}
