<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="584" viewBox="0 0 1200 584" role="img" aria-labelledby="title desc">
<title id="title">RemoteShield X architecture</title><desc id="desc">A control plane of clients, Nginx/backend and PostgreSQL is separate from native OS policy, WireGuard/VPS and destination website traffic. Policy decisions do not prove enforcement.</desc>
<defs><linearGradient id="accent"><stop stop-color="#58e7f3"/><stop offset="1" stop-color="#2788ff"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#58e7f3"/></marker></defs>
<rect width="1200" height="584" rx="20" fill="#071426"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="42" y="52" fill="#f1f7ff" font-size="31" font-weight="600">Control decisions. Separate enforcement.</text><text x="42" y="84" fill="#adc3db" font-size="18" font-weight="400">Current modular architecture · not a network-protection certification</text><text x="42" y="132" fill="#58e7f3" font-size="15" font-weight="600">CONTROL PLANE</text><rect x="42" y="158" width="280" height="112" rx="12" fill="#0d2038" stroke="#244364"/><rect x="42" y="176" width="3" height="28" fill="#58e7f3"/><text x="64" y="193" fill="#f1f7ff" font-size="22" font-weight="600">Clients</text><text x="64" y="223" fill="#adc3db" font-size="17" font-weight="400">Desktop · Android · Admin</text><text x="64" y="246" fill="#adc3db" font-size="17" font-weight="400">Independent runtime boundaries</text><rect x="400" y="158" width="350" height="112" rx="12" fill="#0d2038" stroke="#244364"/><rect x="400" y="176" width="3" height="28" fill="#58e7f3"/><text x="422" y="193" fill="#f1f7ff" font-size="22" font-weight="600">Nginx + backend</text><text x="422" y="223" fill="#adc3db" font-size="17" font-weight="400">Versioned API · session checks</text><text x="422" y="246" fill="#adc3db" font-size="17" font-weight="400">Config · policy decisions · events</text><rect x="830" y="158" width="328" height="112" rx="12" fill="#0d2038" stroke="#244364"/><rect x="830" y="176" width="3" height="28" fill="#58e7f3"/><text x="852" y="193" fill="#f1f7ff" font-size="22" font-weight="600">PostgreSQL</text><text x="852" y="223" fill="#adc3db" font-size="17" font-weight="400">Users · sessions · legacy rules</text><text x="852" y="246" fill="#adc3db" font-size="17" font-weight="400">Explicit migration history</text><path d="M324 214L397 214" fill="none" stroke="#58e7f3" stroke-width="2" marker-end="url(#arrow)"/><path d="M752 214L827 214" fill="none" stroke="#58e7f3" stroke-width="2" marker-end="url(#arrow)"/><path d="M42 316H1158" stroke="#244364" stroke-dasharray="5 8"/><text x="42" y="355" fill="#58e7f3" font-size="15" font-weight="600">NETWORK / NATIVE ENFORCEMENT</text><rect x="42" y="382" width="280" height="112" rx="12" fill="#0d2038" stroke="#244364"/><rect x="42" y="400" width="3" height="28" fill="#58e7f3"/><text x="64" y="417" fill="#f1f7ff" font-size="22" font-weight="600">Native + OS policy</text><text x="64" y="447" fill="#adc3db" font-size="17" font-weight="400">WebView navigation · firewall</text><text x="64" y="470" fill="#adc3db" font-size="17" font-weight="400">Routing · DNS · IPv4 / IPv6</text><rect x="400" y="382" width="350" height="112" rx="12" fill="#0d2038" stroke="#244364"/><rect x="400" y="400" width="3" height="28" fill="#58e7f3"/><text x="422" y="417" fill="#f1f7ff" font-size="22" font-weight="600">WireGuard + VPS</text><text x="422" y="447" fill="#adc3db" font-size="17" font-weight="400">Tunnel · routing / NAT</text><text x="422" y="470" fill="#adc3db" font-size="17" font-weight="400">Separate privileged deployment</text><rect x="830" y="382" width="328" height="112" rx="12" fill="#0d2038" stroke="#244364"/><rect x="830" y="400" width="3" height="28" fill="#58e7f3"/><text x="852" y="417" fill="#f1f7ff" font-size="22" font-weight="600">Destination</text><text x="852" y="447" fill="#adc3db" font-size="17" font-weight="400">Website traffic flows here</text><text x="852" y="470" fill="#adc3db" font-size="17" font-weight="400">Not through the policy API</text><path d="M324 438L397 438" fill="none" stroke="#58e7f3" stroke-width="2" marker-end="url(#arrow)"/><path d="M752 438L827 438" fill="none" stroke="#58e7f3" stroke-width="2" marker-end="url(#arrow)"/><path d="M180 272L180 378" fill="none" stroke="#58e7f3" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 6"/><text x="202" y="302" fill="#adc3db" font-size="16" font-weight="400">decision ≠ enforcement</text><text x="42" y="547" fill="#adc3db" font-size="17" font-weight="400">Solid arrows: intended data flow. Dashed arrow: policy advice. Native/network guarantees remain unverified.</text></g></svg>
