<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">Security workflow and open boundaries</title><desc id="desc">Configuration validation, session authentication and policy decisions precede native enforcement. Native, tunnel, DNS and trust verification remain incomplete; logs and readiness are observations.</desc>
<defs><linearGradient id="accent"><stop stop-color="#58e7f3"/><stop offset="1" stop-color="#2788ff"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#58e7f3"/></marker></defs>
<rect width="1200" height="590" rx="20" fill="#071426"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="42" y="52" fill="#f1f7ff" font-size="31" font-weight="600">Security is a chain of explicit checks.</text><text x="42" y="84" fill="#adc3db" font-size="18" font-weight="400">Implemented control checks and the remaining native / network verification boundary</text><circle cx="68" cy="151" r="23" fill="#0d2038" stroke="#58e7f3"/><text x="56" y="157" fill="#58e7f3" font-size="17" font-weight="600">01</text><text x="112" y="150" fill="#f1f7ff" font-size="23" font-weight="600">Validate configuration</text><text x="112" y="179" fill="#adc3db" font-size="18" font-weight="400">Reject invalid production settings</text><path d="M68 177L68 199" fill="none" stroke="#58e7f3" stroke-width="2" marker-end="url(#arrow)"/><circle cx="68" cy="249" r="23" fill="#0d2038" stroke="#58e7f3"/><text x="56" y="255" fill="#58e7f3" font-size="17" font-weight="600">02</text><text x="112" y="248" fill="#f1f7ff" font-size="23" font-weight="600">Authenticate the session</text><text x="112" y="277" fill="#adc3db" font-size="18" font-weight="400">Token + active session + role gates</text><path d="M68 275L68 297" fill="none" stroke="#58e7f3" stroke-width="2" marker-end="url(#arrow)"/><circle cx="68" cy="347" r="23" fill="#0d2038" stroke="#58e7f3"/><text x="56" y="353" fill="#58e7f3" font-size="17" font-weight="600">03</text><text x="112" y="346" fill="#f1f7ff" font-size="23" font-weight="600">Evaluate policy</text><text x="112" y="375" fill="#adc3db" font-size="18" font-weight="400">Control-plane allow / deny decision</text><path d="M68 373L68 395" fill="none" stroke="#58e7f3" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 6"/><circle cx="68" cy="445" r="23" fill="#0d2038" stroke="#58e7f3"/><text x="56" y="451" fill="#58e7f3" font-size="17" font-weight="600">04</text><text x="112" y="444" fill="#f1f7ff" font-size="23" font-weight="600">Enforce and measure</text><text x="112" y="473" fill="#adc3db" font-size="18" font-weight="400">Native / OS / tunnel work remains</text><rect x="715" y="139" width="435" height="112" rx="12" fill="#0d2038" stroke="#244364"/><rect x="715" y="157" width="3" height="28" fill="#58e7f3"/><text x="737" y="174" fill="#f1f7ff" font-size="22" font-weight="600">Observe and correlate</text><text x="737" y="204" fill="#adc3db" font-size="17" font-weight="400">Structured errors + request IDs</text><text x="737" y="227" fill="#adc3db" font-size="17" font-weight="400">Migration / readiness checks</text><rect x="715" y="310" width="435" height="112" rx="12" fill="#0d2038" stroke="#244364"/><rect x="715" y="328" width="3" height="28" fill="#f6cc78"/><text x="737" y="345" fill="#f1f7ff" font-size="22" font-weight="600">Open security work</text><text x="737" y="375" fill="#adc3db" font-size="17" font-weight="400">Refresh rotation · tenant isolation</text><text x="737" y="398" fill="#adc3db" font-size="17" font-weight="400">Device trust · DNS / tunnel failure</text><text x="42" y="552" fill="#adc3db" font-size="18" font-weight="400">A successful API response, health check or UI VPN indicator is not a security attestation.</text></g></svg>
