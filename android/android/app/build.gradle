plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def signing = new Properties()
def signingFile = rootProject.file("key.properties")
if (signingFile.exists()) {
    signingFile.withReader("UTF-8") { signing.load(it) }
}
def signingPath = signing.getProperty("storeFile", System.getenv("KEYSTORE_PATH"))
def signingStorePassword = signing.getProperty("storePassword", System.getenv("STORE_PASSWORD"))
def signingAlias = signing.getProperty("keyAlias", System.getenv("KEY_ALIAS"))
def signingKeyPassword = signing.getProperty("keyPassword", System.getenv("KEY_PASSWORD"))
def signingValues = [signingPath, signingStorePassword, signingAlias, signingKeyPassword]
def signed = signingValues.every { it?.trim() }
if (!signed && signingValues.any { it?.trim() }) {
    throw new GradleException("Android release signing configuration is incomplete.")
}
if (signed && !rootProject.file(signingPath).isFile()) {
    throw new GradleException("Android release keystore file does not exist.")
}

android {
    namespace "com.remoteshieldx.browser"
    compileSdk 36
    buildToolsVersion "36.0.0"
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    defaultConfig {
        applicationId "com.remoteshieldx.browser"
        minSdk 26
        targetSdk 36
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        release {
            if (signed) {
                storeFile rootProject.file(signingPath)
                storePassword signingStorePassword
                keyAlias signingAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        debug { applicationIdSuffix ".debug" }
        release {
            if (signed) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

flutter { source "../.." }
