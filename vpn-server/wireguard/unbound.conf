# Dedicated Unbound instance. Merge with existing resolver policy before use.
server:
    interface: 10.8.0.1
    interface: fd42:5253:5800::1
    access-control: 0.0.0.0/0 refuse
    access-control: ::/0 refuse
    access-control: 10.8.0.0/24 allow
    access-control: fd42:5253:5800::/64 allow
    do-udp: yes
    do-tcp: yes
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes
